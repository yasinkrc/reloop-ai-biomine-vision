[project]
name = "biomine-vision-backend"
version = "0.1.0"
description = "BioMine Vision — biyoliç ve mikrobiyoloji mikroskop görüntü analizi backend"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
